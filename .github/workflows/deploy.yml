# On every push to main: build the site and publish the built archive to the
# `hostinger-release` branch. Hostinger pulls that branch and deploys site.zip
# into public_html for houriamall.shop.
name: Build Hostinger release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package site.zip
        run: |
          mkdir -p release
          (cd dist && zip -qr ../release/site.zip .)
          printf 'Built site archive for Hostinger. Generated from main by CI — do not edit by hand.\n' > release/README.md
      - name: Publish to hostinger-release branch
        run: |
          cd release
          git init -q -b hostinger-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Release build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hostinger-release
